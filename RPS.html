<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK PAPER SCISSORS</title>
    <style>
        body{
            background-color:black;
            color: white;
            position: relative;
            

        }
        .ins{
            border: 0.01px doted white;
            background-color: black;
            color: white;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 25px;
            
        }
        h3{
            text-align: center;
            font-weight: bold;
            font-size:80px;
            
           
        }
        .rock,.paper,.scissors{
           font-size:150px;
           border: 2px solid white;
           border-radius: 50%;
           background-color: black;
           margin-right: 50px;
           position:relative;
           left: 400px;
           cursor: pointer;


        }
        .rock:hover{
            background-color: white;
        }
        .paper:hover{
            background-color: white;
        }
        .scissors:hover{
            background-color: white;
        }
        .js-result{
            font-size:50px;
           display: flex;
           align-items: center;
           justify-content: center;
           
          
           
          

        }
        .js-moves{
           font-size:35px;
           display: flex;
           align-items: center;
           
          
        }
        .restore{
            position: absolute;
            left:1190px ;
            bottom: -60px;
            font-size: xx-large;
            border-radius: 35px;
            background-color: rgb(204, 176, 33);
            color: white;
            padding: 5px 10px 5px 10px;
        }
        .restore:hover{
            background-color: black;
        }
        .js-score{
            position: absolute;
            bottom: -25px;
            left: 1130px;
            color: yellow;
            font-size: 35px;

        }
        .autoPlay{
            position: absolute;
            right:1200px ;
            bottom: -65px;
            font-size: xx-large;
            border-radius: 35px;
            background-color: rgb(204, 176, 33);
            color: white;
            padding: 5px 10px 5px 10px;
            margin-top: 6px;
        }
        .js-score,.restore{
            border: 1px solid white;
            margin-left: 10px;
        }
        
        

    </style>
</head>
<body>
    <button onclick="ins()"
    class="ins">🎮 How to Play </button>
    <div class="insInfo"></div>








    <h3> Rock Paper Scissors</h3>
    <button class="rock keyRock" >✊</button>


    <button class="paper keyPaper">✋</button>




    <button  class="scissors keyScissor">✌️</button>


    <p class="js-result"></p>
    <p class="js-moves"></p>
    <p class="js-score"></p>
   

    <button onclick="
    score.wins=0;
    score.losses=0;
    score.Ties=0;
    localStorage.removeItem('score');
    updateScoreElement();
    " class="restore">Reset Score</button>
    
    <button class="autoPlay keyAutoplay">Auto Play</button>

    <script>
      function ins(){
       const info= document.querySelector('.insInfo');
       
       if(info.innerHTML === ''){
       info.innerHTML=`
       
            🪨 Press R → Choose Rock <br>
            📄 Press P → Choose Paper <br>
            ✂️ Press S → Choose Scissors <br>
            🤖 Press A → Start Auto Play <br>

            Or, you can simply click the Rock, Paper, or Scissors buttons on the screen to make your choice.`;
      }else {
        info.innerHTML='';
      }

    }



        let score=JSON.parse(localStorage.getItem('score'))|| {
                wins:0,
                losses:0,
                Ties:0
            };
            updateScoreElement();
        // if(!score){
        //     score={
        //         wins:0,
        //         losses:0,
        //         Ties:0
        //     };
        // }
        let isAutoPlaying=false;
        let intervalId;
        function autoPlay(){
            if (!isAutoPlaying){
               intervalId= setInterval(function(){
                const playerMove= pickCmpMove();
                playGame(playerMove);

                },1000);
                isAutoPlaying=true;

            }else {
                clearInterval(intervalId);
                isAutoPlaying=false;

            }

            
        }
        document.querySelector('.keyRock')
        .addEventListener('click',() => {
            playGame('✊');

        });
        document.querySelector('.keyPaper')
        .addEventListener('click', () => {
            playGame('🖐️');
        });
        document.querySelector('.keyScissor')
            .addEventListener('click',() => {
                playGame('✌️');
            
        });
        document.querySelector('.keyAutoplay')
        .addEventListener('click', () => {
            autoPlay('isAutoPlaying');
        });



        document.body.addEventListener('keydown', (event) => {
            if(event.key === 'r'){
                playGame('✊');
            }else if(event.key === 'p'){
                playGame('🖐️');
            }else if(event.key === 's'){
                playGame('✌️');
            }else if(event.key === 'a'){
                autoPlay('isAutoPlaying');
            }
        });

        
         
        function playGame(playerMove){
            const cmpMove=pickCmpMove();
            console.log(cmpMove);
            let rslt='';

            if(playerMove==='✌️'){
                 if(cmpMove === '✊'){
                        rslt='You Lose';
                }else if(cmpMove === '🖐️'){
                         rslt='You Win!';
                }else if(cmpMove==='✌️'){
                        rslt='Tie';
                }
                
            }else if(playerMove==='🖐️'){
                    if(cmpMove === '✊'){
                        rslt='You Win!';
                    }else if(cmpMove === '🖐️'){
                        rslt='Tie';
                    }else if(cmpMove==='✌️'){
                        rslt='You Lose';
                    }

                }else if(playerMove==='✊'){
                    if(cmpMove === '✊'){
                         rslt='Tie';
                        }else if(cmpMove === '🖐️'){
                            rslt='You Lose';
                        }else if(cmpMove==='✌️'){
                            rslt='You Win!';
                        }
                }


            
                    if (rslt==='You Win!'){
                        score.wins+=1;
                    }else if(rslt==='You Lose'){
                        score.losses+=1;
                    }else if(rslt==='Tie'){
                        score.Ties+=1;
                    }

                    localStorage.setItem('score',JSON.stringify(score));

                    updateScoreElement();
                    document.querySelector('.js-result').innerHTML=rslt;
                    document.querySelector('.js-moves')
                    .innerHTML=`You Picked ${playerMove} | Computer Picked ${cmpMove}`;
           
            // alert(`you picked ${playerMove}. computer picked: ${cmpMove}. ${rslt} 
            // wins:${score.wins},losses:${score.losses},Ties:${score.Ties}`);
        }
        function updateScoreElement(){
            document.querySelector('.js-score')
                .innerHTML= `wins:${score.wins},losses:${score.losses},
                Ties:${score.Ties}`;
        }

         function pickCmpMove(){
            const randm = Math.random();
            let cmpMove='';
            if(randm >= 0 && randm <= 1/3){
               cmpMove='✊';
            }else if(randm >= 1/3 && randm<= 2/3){
               cmpMove='🖐️';
            }else if(randm >= 2/3 && randm<=1){
                cmpMove='✌️';
            }
            return cmpMove;
        }

    </script>
</body>
</html>
