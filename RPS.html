<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK PAPER SCISSORS</title>
    <link rel="stylesheet" href="RPS.css">
</head>
<body>
    <button onclick="ins()"
    class="ins">🎮 How to Play </button>
    <div class="insInfo"></div>








    <h3> Rock Paper Scissors</h3>
    <button class="rock keyRock" >✊</button>


    <button class="paper keyPaper">✋</button>




    <button  class="scissors keyScissor">✌️</button>


    <p class="js-result"></p>
    <p class="js-moves"></p>
    <p class="js-score"></p>
   

    <button onclick="
    score.wins=0;
    score.losses=0;
    score.Ties=0;
    localStorage.removeItem('score');
    updateScoreElement();
    " class="restore">Reset Score</button>
    
    <button class="autoPlay keyAutoplay">Auto Play</button>

   <script src="RPS.js"></script>
</body>
</html>
