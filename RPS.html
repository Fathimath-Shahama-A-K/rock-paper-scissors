<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK PAPER SCISSORS</title>
    <style>
        body{
            background-color:black;
            color: white;
            position: relative;
            

        }
        h3{
            text-align: center;
            font-weight: bold;
            font-size:100px;
           
        }
        .rock,.paper,.scissors{
           font-size:150px;
           border: 2px solid white;
           border-radius: 50%;
           background-color: black;
           margin-right: 50px;
           position:relative;
           left: 400px;
           cursor: pointer;


        }
        .rock:hover{
            background-color: white;
        }
        .paper:hover{
            background-color: white;
        }
        .scissors:hover{
            background-color: white;
        }
        .js-result{
            font-size:50px;
           display: flex;
           align-items: center;
           justify-content: center;
           
          
           
          

        }
        .js-moves{
            font-size:35px;
           display: flex;
           align-items: center;
           
          
        }
        .restore{
            position: absolute;
            left:1300px ;
            bottom: -60px;
            font-size: xx-large;
            border-radius: 35px;
            background-color: rgb(204, 176, 33);
            color: white;
            padding: 5px 10px 5px 10px;
        }
        .restore:hover{
            background-color: black;
        }
        .js-score{
            position: absolute;
            bottom: 10px;
            left: 1250px;
            color: yellow;
            font-size: 25px;

        }
        
        

    </style>
</head>
<body>
    <h3> Rock Paper Scissors</h3>
    <button onclick="
    playGame('✊');
    " class="rock">✊</button>


    <button onclick="
    playGame('🖐️');
    " class="paper">✋</button>




    <button onclick="
       playGame('✌️');
    " class="scissors">✌️</button>


    <p class="js-result"></p>
    <p class="js-moves"></p>
    <p class="js-score"></p>
   

    <button onclick="
    score.wins=0;
    score.losses=0;
    score.Ties=0;
    localStorage.removeItem('score');
    updateScoreElement();
    " class="restore">Reset Score</button>

    <script>
        let score=JSON.parse(localStorage.getItem('score'))|| {
                wins:0,
                losses:0,
                Ties:0
            };
            updateScoreElement();
        // if(!score){
        //     score={
        //         wins:0,
        //         losses:0,
        //         Ties:0
        //     };
        // }

        
         
        function playGame(playerMove){
            const cmpMove=pickCmpMove();
            console.log(cmpMove);
            let rslt='';

            if(playerMove==='✌️'){
                 if(cmpMove === '✊'){
                        rslt='You Lose';
                }else if(cmpMove === '🖐️'){
                         rslt='You Win!';
                }else if(cmpMove==='✌️'){
                        rslt='Tie';
                }
                
            }else if(playerMove==='🖐️'){
                    if(cmpMove === '✊'){
                        rslt='You Win!';
                    }else if(cmpMove === '🖐️'){
                        rslt='Tie';
                    }else if(cmpMove==='✌️'){
                        rslt='You Lose';
                    }

                }else if(playerMove==='✊'){
                    if(cmpMove === '✊'){
                         rslt='Tie';
                        }else if(cmpMove === '🖐️'){
                            rslt='You Lose';
                        }else if(cmpMove==='✌️'){
                            rslt='You Win!';
                        }
                }


            
                    if (rslt==='You Win!'){
                        score.wins+=1;
                    }else if(rslt==='You Lose'){
                        score.losses+=1;
                    }else if(rslt==='Tie'){
                        score.Ties+=1;
                    }

                    localStorage.setItem('score',JSON.stringify(score));

                    updateScoreElement();
                    document.querySelector('.js-result').innerHTML=rslt;
                    document.querySelector('.js-moves')
                    .innerHTML=`You Picked ${playerMove} | Computer Picked ${cmpMove}`;
           
            // alert(`you picked ${playerMove}. computer picked: ${cmpMove}. ${rslt} 
            // wins:${score.wins},losses:${score.losses},Ties:${score.Ties}`);
        }
        function updateScoreElement(){
            document.querySelector('.js-score')
                .innerHTML= `wins:${score.wins},losses:${score.losses},
                Ties:${score.Ties}`;
        }

         function pickCmpMove(){
            const randm = Math.random();
            let cmpMove='';
            if(randm >= 0 && randm <= 1/3){
               cmpMove='✊';
            }else if(randm >= 1/3 && randm<= 2/3){
               cmpMove='🖐️';
            }else if(randm >= 2/3 && randm<=1){
                cmpMove='✌️';
            }
            return cmpMove;
        }

    </script>
</body>
</html>
